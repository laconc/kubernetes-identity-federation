name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: write

env:
  IMAGE_PREFIX: quay.io/laconc
  IMAGE_TAG: latest

jobs:
  lint:
    runs-on: ubuntu-24.04
    name: Lint
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          show-progress: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: app

      - name: Lint
        shell: bash
        timeout-minutes: 5
        run: make lint

  test:
    runs-on: ubuntu-24.04
    name: Test
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          show-progress: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: app

      - name: Test
        shell: bash
        timeout-minutes: 5
        run: make test

  verify-crds:
    runs-on: ubuntu-24.04
    name: Verify CRDs
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          show-progress: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: app

      - name: Verify CRDs
        shell: bash
        timeout-minutes: 2
        run: make verify-crds

  e2e:
    runs-on: ubuntu-24.04
    name: E2E Tests
    needs:
      - test
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          show-progress: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: app

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Install kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          install_only: true

      - name: Run e2e setup
        run: make e2e-setup IMAGE_TAG=kif-e2e GHA_CACHE=1
        timeout-minutes: 30

      - name: Run e2e tests
        run: ./e2e/run.sh
        timeout-minutes: 30

      - name: Collect debug info on failure
        if: failure()
        run: |
          echo "=== Pods ==="
          kubectl get pods -A || true
          echo "=== Events ==="
          kubectl get events -A --sort-by='.lastTimestamp' | tail -40 || true
          echo "=== kif-federation logs ==="
          kubectl logs -n kif deployment/kif-federation --tail=50 || true
          echo "=== kif-issuer logs ==="
          kubectl logs -n kif deployment/kif-issuer --tail=50 || true
          echo "=== kif-webhook logs ==="
          kubectl logs -n kif deployment/kif-webhook --tail=50 || true

      - name: Teardown e2e cluster
        if: always()
        run: make e2e-teardown

  build-and-push:
    runs-on: ubuntu-24.04
    name: Build and push images
    permissions:
      contents: read
      actions: write
      id-token: write
    needs:
      - e2e
      - lint
      - verify-crds
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          show-progress: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to Quay.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build images
        run: make build-images IMAGE_TAG=${{ env.IMAGE_TAG }} GHA_CACHE=1 IMAGE_PREFIX=${{ env.IMAGE_PREFIX }}

      - name: Push images
        if: github.event_name == 'push'
        run: make push-images IMAGE_TAG=${{ env.IMAGE_TAG }} IMAGE_PREFIX=${{ env.IMAGE_PREFIX }}

      - name: Sign images
        if: github.event_name == 'push'
        run: make sign-images IMAGE_TAG=${{ env.IMAGE_TAG }} IMAGE_PREFIX=${{ env.IMAGE_PREFIX }} GIT_REPO=${{ github.repository }}
