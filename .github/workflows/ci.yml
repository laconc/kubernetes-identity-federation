name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_PREFIX: quay.io/laconc
  IMAGE_TAG: dev

jobs:
  lint:
    runs-on: ubuntu-24.04
    name: Lint
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Lint
        shell: bash
        timeout-minutes: 5
        run: make lint

  test:
    runs-on: ubuntu-24.04
    name: Test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Test
        shell: bash
        timeout-minutes: 5
        run: make test

  verify-crd:
    runs-on: ubuntu-24.04
    name: Verify CRD
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Verify CRD
        shell: bash
        timeout-minutes: 2
        run: make verify-crds

  build-and-push:
    runs-on: ubuntu-24.04
    name: Build and push images
    needs:
      - lint
      - test
      - verify-crd
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          show-progress: false

      #      - name: Login to Quay.io
      #        uses: docker/login-action@v3
      #        with:
      #          registry: quay.io
      #          username: ${{ secrets.QUAY_USERNAME }}
      #          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build images
        run: |
          make build-images \
            IMAGE_TAG=${{ env.IMAGE_TAG }}

