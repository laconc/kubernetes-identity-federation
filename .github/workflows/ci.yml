name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: write

env:
  IMAGE_PREFIX: quay.io/laconc
  IMAGE_TAG: latest

jobs:
  lint:
    runs-on: ubuntu-24.04
    name: Lint
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Lint
        shell: bash
        timeout-minutes: 5
        run: make lint

  test:
    runs-on: ubuntu-24.04
    name: Test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Test
        shell: bash
        timeout-minutes: 5
        run: make test

  verify-crds:
    runs-on: ubuntu-24.04
    name: Verify CRDs
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Verify CRDs
        shell: bash
        timeout-minutes: 2
        run: make verify-crds

  e2e:
    runs-on: ubuntu-24.04
    name: E2E Tests
    needs:
      - test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Run e2e setup
        run: make e2e-setup IMAGE_TAG=kif-e2e
        timeout-minutes: 15

      - name: Run e2e tests
        run: ./e2e/run.sh
        timeout-minutes: 15

      - name: Collect debug info on failure
        if: failure()
        run: |
          echo "=== Pods ==="
          kubectl get pods -A || true
          echo "=== Events ==="
          kubectl get events -A --sort-by='.lastTimestamp' | tail -40 || true
          echo "=== kif-federation logs ==="
          kubectl logs -n kif deployment/kif-federation --tail=50 || true
          echo "=== kif-issuer logs ==="
          kubectl logs -n kif deployment/kif-issuer --tail=50 || true
          echo "=== kif-webhook logs ==="
          kubectl logs -n kif deployment/kif-webhook --tail=50 || true

      - name: Teardown e2e cluster
        if: always()
        run: make e2e-teardown

  build-and-push:
    runs-on: ubuntu-24.04
    name: Build and push images
    permissions:
      contents: read
      actions: write
      id-token: write
    needs:
      - e2e
      - lint
      - verify-crds
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Cache deps stage
        run: make deps-cache GHA_CACHE=1

      - name: Build images
        run: make build-images IMAGE_TAG=${{ env.IMAGE_TAG }} GHA_CACHE=1 IMAGE_PREFIX=${{ env.IMAGE_PREFIX }}

      - name: Push images
        if: github.event_name == 'push'
        run: make push-images IMAGE_TAG=${{ env.IMAGE_TAG }} IMAGE_PREFIX=${{ env.IMAGE_PREFIX }}

      - name: Sign images
        if: github.event_name == 'push'
        run: make sign-images IMAGE_TAG=${{ env.IMAGE_TAG }} IMAGE_PREFIX=${{ env.IMAGE_PREFIX }} GIT_REPO=${{ github.repository }}
