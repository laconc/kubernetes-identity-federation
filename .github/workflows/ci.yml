name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: write

env:
  IMAGE_PREFIX: quay.io/laconc
  IMAGE_TAG: dev

jobs:
  lint:
    runs-on: ubuntu-24.04
    name: Lint
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Lint
        shell: bash
        timeout-minutes: 5
        run: make lint

  test:
    runs-on: ubuntu-24.04
    name: Test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Test
        shell: bash
        timeout-minutes: 5
        run: make test

  verify-crds:
    runs-on: ubuntu-24.04
    name: Verify CRDs
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Verify CRDs
        shell: bash
        timeout-minutes: 2
        run: make verify-crds

  build-and-push:
    runs-on: ubuntu-24.04
    name: Build and push images
    permissions:
      contents: read
      actions: write
      id-token: write
    needs:
      - lint
      - test
      - verify-crds
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Cache deps stage
        run: make deps-cache GHA_CACHE=1

      - name: Build images
        run: make build-images IMAGE_TAG=${{ env.IMAGE_TAG }} GHA_CACHE=1

      - name: Push images
        if: github.event_name == 'push'
        run: make push-images IMAGE_TAG=${{ env.IMAGE_TAG }} IMAGE_PREFIX=${{ env.IMAGE_PREFIX }}

      - name: Sign images
        if: github.event_name == 'push'
        run: make sign-images IMAGE_TAG=${{ env.IMAGE_TAG }} IMAGE_PREFIX=${{ env.IMAGE_PREFIX }} GIT_REPO=${{ github.repository }}
