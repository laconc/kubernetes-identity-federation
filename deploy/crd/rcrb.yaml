metadata:
  name: resolvedcloudrolebindings.64f.dev
spec:
  group: 64f.dev
  names:
    categories: []
    kind: ResolvedCloudRoleBinding
    plural: resolvedcloudrolebindings
    shortNames:
    - rcrb
    singular: resolvedcloudrolebinding
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.subject.serviceAccountName
