apiVersion: v1
kind: Service
metadata:
  name: {{ include "kif.fullname" . }}-federation
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kif.labels" . | nindent 4 }}
    app.kubernetes.io/component: federation
spec:
  type: {{ .Values.federation.service.type }}
  selector:
    {{- include "kif.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: federation
  ports:
    - name: http
      port: {{ .Values.federation.service.port }}
      targetPort: http
      protocol: TCP
