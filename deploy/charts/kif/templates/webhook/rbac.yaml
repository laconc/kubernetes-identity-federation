apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kif-webhook
  labels:
    {{- include "kif.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
rules:
  - apiGroups: ["64f.dev"]
    resources: ["cloudrolebindings", "cloudrolebindings/status"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["64f.dev"]
    resources: ["resolvedcloudrolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kif-webhook
  labels:
    {{- include "kif.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
subjects:
  - kind: ServiceAccount
    name: {{ .Values.webhook.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: kif-webhook
  apiGroup: rbac.authorization.k8s.io
