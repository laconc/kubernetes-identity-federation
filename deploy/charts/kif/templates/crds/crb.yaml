{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudrolebindings.64f.dev
  {{- if .Values.crds.keep }}
  annotations:
    "helm.sh/resource-policy": keep
  {{- end }}
spec:
  group: 64f.dev
  names:
    categories:
    - all
    kind: CloudRoleBinding
    plural: cloudrolebindings
    shortNames:
    - crb
    singular: cloudrolebinding
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.subject.serviceAccountName
      name: ServiceAccount
      type: string
    - jsonPath: .status.providers
      name: Providers
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for CloudRoleBindingSpec via `CustomResource`
        properties:
          spec:
            description: |-
              CloudRoleBinding binds a Kubernetes ServiceAccount (in the same namespace)
              to one or more cloud providers.

              This CRD supports either:
              - a single CloudRoleBinding configuring multiple providers for the ServiceAccount, or
              - multiple CloudRoleBindings for the same ServiceAccount configuring different providers.
            properties:
              attributes:
                description: Optional attributes to include in minted provider tokens for ABAC decisions.
                nullable: true
                properties:
                  extra:
                    additionalProperties:
                      type: string
                    description: Additional attributes to include in minted tokens.
                    nullable: true
                    type: object
                  includeProvenance:
                    description: |-
                      Include standard Kubernetes provenance attributes by default.

                      If unset, treated as true.
                    nullable: true
                    type: boolean
                type: object
              providers:
                default: {}
                description: Provider-specific configuration. Any subset may be provided.
                properties:
                  aws:
                    nullable: true
                    properties:
                      audience:
                        description: Audience to use when minting the AWS token.
                        minLength: 1
                        nullable: true
                        type: string
                      maxSessionDurationSeconds:
                        description: Max session duration.
                        format: uint64
                        minimum: 0.0
                        nullable: true
                        type: integer
                      region:
                        description: Default AWS region.
                        minLength: 1
                        nullable: true
                        type: string
                      roleArn:
                        description: IAM Role ARN to assume via STS AssumeRoleWithWebIdentity.
                        minLength: 1
                        pattern: ^arn:aws:iam::\d{12}:role\/.+$
                        type: string
                      stsRegionalEndpoints:
                        default: true
                        description: If true, inject AWS_STS_REGIONAL_ENDPOINTS=regional.
                        type: boolean
                    required:
                    - roleArn
                    type: object
                  azure:
                    nullable: true
                    properties:
                      audience:
                        description: Audience to use when minting the Azure token.
                        minLength: 1
                        nullable: true
                        type: string
                      clientId:
                        description: Client/app UUID (or managed identity client ID.)
                        minLength: 1
                        pattern: ^[0-9a-fA-F-]{36}$
                        type: string
                      tenantId:
                        description: Entra tenant UUID.
                        minLength: 1
                        pattern: ^[0-9a-fA-F-]{36}$
                        type: string
                    required:
                    - clientId
                    - tenantId
                    type: object
                  gcp:
                    nullable: true
                    properties:
                      audience:
                        description: Audience to use when minting the GCP token.
                        minLength: 1
                        nullable: true
                        type: string
                      projectId:
                        minLength: 1
                        nullable: true
                        type: string
                      serviceAccountEmail:
                        description: GCP service account email.
                        minLength: 1
                        pattern: ^[^@\s]+@[^@\s]+\.iam\.gserviceaccount\.com$
                        type: string
                      workloadIdentityProvider:
                        description: Full resource name of the Workload Identity Provider.
                        minLength: 1
                        type: string
                    required:
                    - serviceAccountEmail
                    - workloadIdentityProvider
                    type: object
                type: object
              subject:
                description: The subject in this namespace this binding applies to.
                properties:
                  serviceAccountName:
                    description: ServiceAccount in the same namespace.
                    minLength: 1
                    type: string
                required:
                - serviceAccountName
                type: object
            required:
            - subject
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                description: Conditions set by your controller (validation status, conflicts, etc.)
                items:
                  properties:
                    lastTransitionTime:
                      description: RFC3339 timestamp of last transition.
                      format: date-time
                      type: string
                    message:
                      description: Human-readable message with details about the transition.
                      minLength: 1
                      type: string
                    observedGeneration:
                      description: Generation observed when the condition was set.
                      format: int64
                      type: integer
                    reason:
                      description: Machine-readable reason.
                      enum:
                      - Validated
                      - ProviderConflict
                      - AttributeConflict
                      - ValidationFailed
                      - Error
                      type: string
                    status:
                      enum:
                      - 'True'
                      - 'False'
                      - Unknown
                      type: string
                    type:
                      enum:
                      - Ready
                      - Conflict
                      - InvalidSpec
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - observedGeneration
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastError:
                description: Last error for operator visibility, if there was one.
                nullable: true
                type: string
              providers:
                default: ''
                description: Summary string for quick display (e.g., "aws,azure" or "aws").
                type: string
            type: object
        required:
        - spec
        title: CloudRoleBinding
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
