apiVersion: v1
kind: Service
metadata:
  name: {{ include "kif.fullname" . }}-issuer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kif.labels" . | nindent 4 }}
    app.kubernetes.io/component: issuer
spec:
  type: {{ .Values.issuer.service.type }}
  selector:
    {{- include "kif.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: issuer
  ports:
    - name: http
      port: {{ .Values.issuer.service.port }}
      targetPort: http
      protocol: TCP
