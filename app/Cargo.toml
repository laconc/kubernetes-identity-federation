[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["Dashiel Lopez Mendez <hi@64f.dev>"]
license = "Apache-2.0"
repository = "https://github.com/laconc/kubernetes-identity-federation"
readme = "../README.md"
keywords = ["kubernetes", "identity", "federation", "oidc"]
description = """
Allows Kubernetes workloads to auth and access AWS, Azure, and
GCP resources using OIDC federation.
"""

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
futures = "0.3"
jsonwebtoken = "10.3"
k8s-openapi = { version = "0.27", features = ["latest", "schemars"] }
kube = { version = "3.0", features = ["runtime", "derive"] }
kube-runtime = "3"
openidconnect = "4"
rsa = "0.10.0-rc.15"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
schemars = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# dev deps
reqwest = { version = "0.13", features = ["json"] }
