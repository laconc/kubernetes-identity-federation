[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["Dashiel Lopez Mendez <hi@64f.dev>"]
license = "Apache-2.0"
repository = "https://github.com/laconc/kubernetes-identity-federation"
readme = "../README.md"
keywords = ["kubernetes", "identity", "federation", "oidc"]
description = """
Allows Kubernetes workloads to auth and access AWS, Azure, and
GCP resources using OIDC federation.
"""

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.22"
futures = "0.3"
hex = "0.4"
json-patch = "4"
# `rust_crypto` selects exactly one jsonwebtoken crypto backend; without it
# neither `rust_crypto` nor `aws_lc_rs` is enabled and signing panics at runtime.
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }
k8s-openapi = { version = "0.27", features = ["latest", "schemars"] }
kube = { version = "3.0", features = ["runtime", "derive", "admission"] }
kube-runtime = "3"
openidconnect = "4"
rsa = "0.10.0-rc.15"
rand = "0.10"
rustls = "0.23"
rustls-pemfile = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
schemars = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# dev deps
reqwest = { version = "0.13", features = ["json"] }
tempfile = "3"
