[workspace]
members = ["crates/kif-agent", "crates/kif-api", "crates/kif-crdgen", "crates/kif-federation", "crates/kif-issuer", "crates/kif-webhook"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["Dashiel Lopez Mendez <hi@64f.dev>"]
license = "Apache-2.0"
repository = "https://github.com/laconc/kubernetes-identity-federation"
readme = "../README.md"
description = """
"""

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
kube = { version = "3.0", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.27", features = ["latest", "schemars"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
schemars = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
